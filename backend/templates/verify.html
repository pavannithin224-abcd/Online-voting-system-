<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Voting - Face Verification</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      text-align: center;
      padding-top: 60px;
    }

    .container {
      background: white;
      width: 420px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 25px;
    }

    video, canvas {
      border-radius: 12px;
      margin: 10px 0;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    button {
      background-color: #007BFF;
      color: white;
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      margin-top: 15px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.02);
    }

    .footer {
      font-size: 12px;
      margin-top: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Smart Voting System</h2>
    <p>Step 2: Please capture your live photo for authentication.</p>

    <video id="video" width="320" height="240" autoplay></video><br>
    <button id="capture">Capture & Verify</button>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <div class="footer">
      <p>© 2025 SmartVote Initiative | Secure • Private • Trusted</p>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture');
    const context = canvas.getContext('2d');

    // Access webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => alert('Camera access denied: ' + err));

    captureBtn.addEventListener('click', () => {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('live_capture', blob, 'live_capture.jpg');
        fetch('/verify_face', { method: 'POST', body: formData })
          .then(res => res.json())
          .then(data => {
            alert(data.message);
            if (data.success) {
              window.location.href = '/voting';
            }
          })
          .catch(err => alert('Error: ' + err));
      }, 'image/jpeg');
    });
  </script>

</body>
</html>
