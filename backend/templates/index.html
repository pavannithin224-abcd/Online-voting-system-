<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Voting - ID Verification</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      text-align: center;
      padding-top: 60px;
    }

    .container {
      background: white;
      width: 420px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }

    input {
      width: 95%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #007BFF;
    }

    button {
      background-color: #007BFF;
      color: white;
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
      font-size: 15px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.02);
    }

    .footer {
      font-size: 12px;
      margin-top: 20px;
      color: #666;
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>Smart Voting System</h2>
    <p>Step 1: Enter your details and upload your ID card for verification.</p>

    <form action="/verify" method="POST" enctype="multipart/form-data">
      <!-- Voter Details -->
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter your age" min="18" required>

      <label for="email">Email (optional):</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address">

      <label for="phone">Phone Number (optional):</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

      <!-- ID Upload -->
      <label for="id_card">Upload ID Card:</label>
      <input type="file" name="id_card" accept="image/*" required>

      <button type="submit">Proceed to Face Verification</button>
    </form>

    <div class="footer">
      <p>© 2025 SmartVote Initiative | Secure • Private • Trusted</p>
    </div>
  </div>

</body>
</html>
